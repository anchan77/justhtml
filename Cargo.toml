[workspace]
members = ["justhtml", "justhtml-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
encoding_rs = "0.8"
phf = { version = "0.11", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
